# All seven roles default to the codex provider. No credentials belong here.
providers:
  codex:
    type: codex_cli
    # Optional: set a model available to your Codex account.
    # model: your-model-name
    timeout_seconds: 600

# Adjust these commands to your target repository before running future workflows.
commands:
  test: pytest
  lint: ruff check .
  typecheck: mypy src

# Timeout per validation command, in seconds.
validation:
  timeout_seconds: 300

# Maximum fixer calls across this plan's recorded history.
limits:
  max_fix_cycles: 2
  # Read-only planner revisions after rejection; 0 requests human input immediately.
  max_plan_revisions: 2

# Plan review: human (default) or an independent read-only agent.
gates:
  plan_review: human
  approve_final: true

# Opt in to knowledge documents committed alongside code. Disabled for local-only use.
knowledge:
  enabled: false

# Local same-ticket evidence reuse; no extra model call or Git-tracked artifacts.
context:
  enabled: true
  max_characters: 4000
  # Modes: parallel (default), explorer_first, or single_pass (one investigator).
  investigation_mode: parallel

# Optional local cross-ticket navigation; no model calls or committed artifacts.
project_context:
  enabled: false
  max_characters: 3000
