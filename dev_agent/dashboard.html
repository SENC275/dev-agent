<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dev-agent · Local dashboard</title>
<style>
:root{color-scheme:dark;--bg:#101310;--panel:#191e19;--line:#303930;--muted:#9ba99b;--accent:#c1f080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3e9;font:14px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:28px 18px;background:#141814}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}.brand b{color:var(--accent)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.local{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--accent);margin:16px 0 40px}.project{display:block;text-align:left;width:100%;padding:14px;margin-top:9px;background:transparent;color:inherit;border:1px solid transparent;border-radius:9px;overflow:hidden}.project.active{background:#273223;border-color:#4d6341}.project small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{padding:36px 42px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;font-weight:550;letter-spacing:-1px;margin:4px 0}p{color:var(--muted);margin:4px 0 20px}button,.button{border:1px solid var(--line);background:#242c23;color:#edf3e9;padding:8px 14px;border-radius:7px}.primary{background:var(--accent);color:#1b2912;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:18px 22px;color:var(--muted)}.stat strong{display:block;color:#f2f7ee;font-size:32px;font-weight:500}.toolbar{display:flex;gap:12px;margin:24px 0 16px}input,select{background:#191e19;border:1px solid var(--line);color:inherit;border-radius:7px;padding:10px}input{flex:1;min-width:100px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:500}td,th{padding:15px 18px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover{background:#242d22}.badge{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:11px}.badge:before{content:'';height:6px;width:6px;border-radius:50%;background:currentColor}.running:before{animation:pulse 1.4s infinite}.bad{color:#ffb38b}.muted{color:var(--muted);font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}#notice{color:#ffb38b;white-space:pre-wrap}.detail{margin-top:26px;padding:24px}.detail h2{margin-top:0}.detail h3{font-size:14px;color:var(--accent);margin-top:25px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101610;border:1px solid var(--line);border-radius:8px;padding:15px;font:12px/1.6 ui-monospace,monospace;max-height:430px;overflow:auto}.command{display:flex;gap:10px;margin:9px 0;align-items:center}.command code{flex:1;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}#job{margin-top:20px}footer{margin-top:20px;color:var(--muted);font-size:12px}@keyframes pulse{50%{opacity:.2;box-shadow:0 0 0 5px #c1f02015}}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:18px}.local{margin:8px}.project{display:inline-block;width:220px}main{padding:22px}.stats{gap:8px}.stat{padding:12px}.split{grid-template-columns:1fr}header{align-items:start}.hide-mobile{display:none}}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
dialog{background:#191e19;color:#edf3e9;border:1px solid #4d6341;border-radius:12px;width:min(1000px,94vw);max-height:90vh;padding:24px}dialog::backdrop{background:#000b}textarea{width:100%;background:#101610;color:inherit;border:1px solid var(--line);border-radius:8px;padding:12px;font:13px/1.5 ui-monospace,monospace}label{display:block;margin:12px 0}.toolbar{flex-wrap:wrap}#drafts{display:flex;gap:8px;flex-wrap:wrap}#dialog-error{color:#ffb38b;white-space:pre-wrap}
</style>
<div class="layout"><aside><div class="brand">dev-agent<b> /</b></div><div class="local">● Local workspace</div><div class="eyebrow">Projects</div><nav id="projects"></nav><footer>本地运行 · 数据留在项目中<br>测试执行你的 commands.test</footer></aside><main><header><div><div class="eyebrow">Workspace overview</div><h1 id="title">Dashboard</h1><p id="path">正在连接本地 dev-agent…</p></div><button id="test" class="primary">运行 test</button></header><div id="notice" role="alert"></div><div class="toolbar"><button id="new-ticket" class="primary">新建 ticket</button><button id="configure">配置</button><button id="initialize">初始化配置</button><button id="doctor">环境检查</button><button id="history">作业历史</button></div><div id="drafts"></div><section class="stats" id="stats"></section><div class="toolbar"><input id="search" aria-label="搜索 ticket" placeholder="搜索 ticket ID 或阶段…"><select id="filter" aria-label="状态筛选"><option value="all">所有状态</option><option value="active">处理中</option><option value="review">待审查</option><option value="attention">需要处理</option><option value="merged">已合并</option></select></div><div class="card wrap"><table><thead><tr><th>Ticket</th><th>状态</th><th>当前阶段</th><th class="hide-mobile">最近更新</th><th></th></tr></thead><tbody id="tickets"></tbody></table><div id="empty" class="empty" hidden>还没有运行记录。点击“新建 ticket”，保存草稿后预览并启动。</div></div><div id="job"></div><section id="detail" class="card detail" hidden></section><section class="card detail"><h2>项目知识 / RAG</h2><p>自动增量更新，命中片段带源文件与行号。开启 rag.enabled 后各角色自动检索。</p><div class="toolbar"><input id="rag-query" aria-label="知识检索" placeholder="例如：CloudWatch alarm missing data"><button id="search-rag">检索</button><button id="index-rag">更新索引</button></div><div id="rag-result"></div></section><footer id="connection">每 3 秒刷新 · 打开 ticket 查看审查摘要</footer></main></div>
<dialog id="dialog"><div class="row"><h2 id="dialog-title"></h2><button id="dialog-close">关闭 / 暂不批准</button></div><div id="dialog-error" role="alert"></div><div id="dialog-body"></div></dialog><script>
const token=location.hash.slice(1)||sessionStorage.getItem('dashboardToken');
if(token) sessionStorage.setItem('dashboardToken',token);
history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={projects:[],jobs:{}},selected='0',detailId=null,detailGeneration=0,pending=null;
const seenJobs={};
function html(id,value){if($(id).innerHTML!==value)$(id).innerHTML=value}
async function api(path,body){
 const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Dashboard-Token':token||'','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});
 const d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d;
}
function report(e){$('notice').textContent=e.message||String(e)}
function project(){return data.projects.find(p=>p.id===selected)}
function category(t){if(t.state==='MERGED')return 'merged';if(t.state==='RUNNING')return 'active';if(t.state==='READY_FOR_HUMAN_REVIEW')return 'review';return 'attention'}
function badge(t){return `<span class="badge ${category(t)==='active'?'running':''} ${category(t)==='attention'?'bad':''}">${esc(t.state)}</span>`}
function render(){
 const p=project();if(!p)return;$('title').textContent=p.name;$('path').textContent=p.path;
 html('projects',data.projects.map(x=>`<button class="project ${x.id===selected?'active':''}" data-project="${x.id}">${esc(x.name)} <span class="muted">${x.tickets.length}</span><small>${esc(x.path)}</small></button>`).join(''));
 document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{selected=b.dataset.project;detailId=null;detailGeneration++;$('detail').hidden=true;$('rag-result').textContent='';render()});
 if(p.error)report(p.error);
 html('stats',[['全部 Tickets',p.tickets.length],['处理中',p.tickets.filter(t=>category(t)==='active').length],['待审查',p.tickets.filter(t=>category(t)==='review').length],['需要处理',p.tickets.filter(t=>category(t)==='attention').length]].map(([k,v])=>`<div class="stat">${k}<strong>${v}</strong></div>`).join(''));
 const q=$('search').value.toLowerCase(),f=$('filter').value;
 const list=p.tickets.filter(t=>(f==='all'||category(t)===f)&&[t.ticket_id,t.current_step].join(' ').toLowerCase().includes(q));
 html('tickets',list.map(t=>`<tr tabindex="0" data-ticket="${esc(t.ticket_id)}"><td><strong>${esc(t.ticket_id)}</strong></td><td>${badge(t)}</td><td class="muted">${esc(t.current_step||'—')}</td><td class="hide-mobile muted">${esc(new Date(t.updated_at).toLocaleString())}</td><td>↗</td></tr>`).join(''));
 $('empty').hidden=list.length>0;document.querySelectorAll('[data-ticket]').forEach(r=>{r.onclick=()=>show(r.dataset.ticket);r.onkeydown=e=>{if(e.key==='Enter')show(r.dataset.ticket)}});
 html('drafts',(p.drafts||[]).map(id=>`<button data-draft="${esc(id)}">${esc(id)} · 草稿</button>`).join('')||'<span class="muted">暂无本地草稿</span>');
 document.querySelectorAll('[data-draft]').forEach(b=>b.onclick=()=>preview('save-draft',b.dataset.draft));
 const j=data.jobs[selected];$('test').disabled=!!j?.running;
 html('job',j?`<div class="card detail"><div class="row"><strong>${esc(j.action||'test')} ${esc(j.ticket||'')}</strong><span class="badge ${j.running?'running':j.exit_code?'bad':''}">${esc(j.status||(j.running?'RUNNING':j.exit_code===0?'COMPLETE':'FAILED'))} · ${j.elapsed}s</span></div>${j.error?`<p class="bad">${esc(j.error)}</p>`:''}<pre>${esc(j.output||'工作中，阶段状态会自动刷新…')}</pre>${j.result?`<pre>${esc(JSON.stringify(j.result,null,2))}</pre>`:''}</div>`:'');
 if(j?.id){const signature=j.id+':'+j.running+':'+j.status;if(seenJobs[selected]&&seenJobs[selected]!==signature&&!j.running&&detailId)show(detailId);seenJobs[selected]=signature}
}
async function run(action,ticket='',payload={},confirmation=''){
 const key=pending?.project??selected;
 await api('/api/action',{project:key,action,ticket,payload,confirmation});
 $('dialog').close();pending=null;$('notice').textContent='操作已提交；下方显示作业和运行状态。';
 data=await api('/api/projects');render();
}
function dialog(title,body){$('dialog-title').textContent=title;$('dialog-body').innerHTML=body;$('dialog-error').textContent='';$('dialog').showModal()}
const labels={'approve-plan':'审核计划并开始实现','request-changes':'让 planner 修改计划','edit-plan':'编辑计划','merge':'合并已审查的代码','start':'确认 ticket 并启动','save-draft':'编辑本地 ticket','configure':'项目配置'};
async function preview(action,ticket=''){
 try{
 const key=selected;
 const value=await api('/api/preview',{project:key,ticket,action});
 pending={project:key,ticket,action,value};
 const edit=['edit-plan','save-draft','configure'].includes(action);
 let body=`<p>${esc(project().path)} ${esc(ticket)}</p>`;
 if(action==='merge')body+=`<p>目标分支：${esc(value.destination)}。确认后提交并合并；不会 push 或部署。</p><pre>${esc(value.summary)}</pre>`;
 if(action==='configure')body+='<p>已启动的 ticket 使用冻结配置；修改可能阻止旧 ticket 继续。RAG 可用 rag.enabled: true 开启。</p>';
 body+=edit?'<textarea id="editor" aria-label="编辑内容" rows="18"></textarea>':`<pre>${esc(value.text||'尚无内容')}</pre>`;
 if(action==='request-changes')body+='<label>修改意见<textarea id="feedback" rows="5" placeholder="描述希望 planner 修改的内容"></textarea></label>';
 body+='<div class="toolbar"><button id="confirm-action" class="primary">'+(action==='merge'?'确认合并':action==='approve-plan'?'批准并继续':action==='request-changes'?'发送修改意见':edit?'保存':'启动')+'</button>';
 if(action==='save-draft'&&value.text)body+='<button id="start-draft">查看启动预览</button>';
 body+='</div>';dialog(labels[action],body);if(edit)$('editor').value=value.text;
 $('confirm-action').onclick=async()=>{const p=pending;$('confirm-action').disabled=true;try{await run(p.action,p.ticket,{text:edit?$('editor').value:action==='request-changes'?$('feedback').value:undefined},p.value.confirmation)}catch(e){$('dialog-error').textContent=e.message;$('confirm-action').disabled=false}};
 if($('start-draft'))$('start-draft').onclick=()=>{const p=pending;if($('editor').value!==p.value.text){$('dialog-error').textContent='请先保存修改，再打开启动预览。';return}$('dialog').close();preview('start',p.ticket)};
 }catch(e){report(e)}
}
async function simple(action,ticket='',extra={}){
 pending={project:selected};
 if(['revise'].includes(action)){
 dialog('修改实现结果',`<p>${esc(ticket)}：提交后会调用 agent，重新测试和审查。</p><textarea id="feedback" rows="6" placeholder="输入修改意见"></textarea><button id="send-feedback" class="primary">提交反馈</button>`);
 $('send-feedback').onclick=async()=>{try{await run(action,ticket,{text:$('feedback').value})}catch(e){$('dialog-error').textContent=e.message}};return;
 }
 if(!confirm(`执行 ${action} ${ticket}？模型操作会使用项目配置的 provider。`)){pending=null;return}
 try{await run(action,ticket,extra)}catch(e){report(e);pending=null}
}
function block(title,value){return `<h3>${title}</h3><pre>${esc(typeof value==='string'?value:JSON.stringify(value,null,2))}</pre>`}
async function show(id){
 detailId=id;const generation=++detailGeneration,key=selected,el=$('detail');el.hidden=false;el.textContent='检查当前证据…';
 try{const d=await api(`/api/ticket?project=${key}&ticket=${encodeURIComponent(id)}`);if(generation!==detailGeneration)return;
 el.innerHTML=`<div class="row"><h2>${esc(id)}</h2><button id="refresh-detail">刷新详情</button></div><p>${esc(d.state)} · ${esc(d.worktree||'尚无 worktree')}</p><div id="actions" class="toolbar"></div><div class="toolbar"><label>追加修复次数 <input id="cycles" type="number" min="0" max="10" value="0" style="width:70px"></label></div>${d.warnings?.length?block('注意事项',d.warnings):''}<div class="split"><div>${block('验证（current=false 表示过期）',d.validation)}${block('独立审查',d.review)}</div><div>${block('Token 用量',d.usage)}${block('变更文件',d.files)}</div></div>${block('阶段时间线',d.steps)}`;
 function button(label,callback){const b=document.createElement('button');b.textContent=label;b.onclick=callback;$('actions').append(b)}
 if(d.state==='AWAITING_PLAN_APPROVAL'){
 button('审核 / 批准计划',()=>preview('approve-plan',id));button('R 修改计划',()=>preview('request-changes',id));button('编辑计划',()=>preview('edit-plan',id));
 }
 if(!['MERGED','MERGING','MERGE_FAILED'].includes(d.state))button('继续 resume',()=>simple('resume',id,{additional_fix_cycles:Number($('cycles').value)}));
 if(d.worktree)button('查看 diff',async()=>{try{const diff=await api(`/api/diff?project=${key}&ticket=${encodeURIComponent(id)}`);pending=null;dialog('当前 worktree diff',`<pre>${esc(diff.text)}</pre>`)}catch(e){report(e)}});
 if(d.state==='READY_FOR_HUMAN_REVIEW'){button('修改结果 revise',()=>simple('revise',id));button('同步最新基线',()=>simple('sync',id));button('预览合并',()=>preview('merge',id))}
 if(d.state==='WAITING_FOR_HUMAN')button('继续冲突修复 sync --continue',()=>simple('sync-continue',id));
 $('refresh-detail').onclick=()=>show(id);
 }catch(e){if(generation===detailGeneration)el.textContent=e.message}
}
async function refresh(){try{data=await api('/api/projects');render();$('connection').textContent='● 已连接 · '+new Date().toLocaleTimeString()+' · 每 3 秒刷新；ticket 状态为最近记录'}catch(e){report(e);$('connection').textContent='连接中断；恢复后不会自动重放操作'}finally{setTimeout(refresh,3000)}}
$('search').oninput=render;$('filter').onchange=render;
$('dialog-close').onclick=()=>{$('dialog').close();pending=null};
$('test').onclick=async()=>{if(!confirm('在主项目执行配置的 commands.test？'))return;try{await api('/api/test',{project:selected});data=await api('/api/projects');render()}catch(e){report(e)}};
$('new-ticket').onclick=()=>{
 pending={project:selected};dialog('新建 ticket','<label>Ticket ID<input id="new-id" placeholder="TASK-001"></label><label>需求 / 自写 ticket<textarea id="new-text" rows="8" placeholder="描述需求、约束和验收标准"></textarea></label><div class="toolbar"><button id="generate" class="primary">让 agent 生成草稿</button><button id="manual-draft">保存自写 ticket</button></div>');
 $('generate').onclick=async()=>{try{await run('draft',$('new-id').value,{text:$('new-text').value})}catch(e){$('dialog-error').textContent=e.message}};
 $('manual-draft').onclick=async()=>{try{const key=pending.project,id=$('new-id').value,content=$('new-text').value;const value=await api('/api/preview',{project:key,ticket:id,action:'save-draft'});if(value.text)throw Error('ID 已存在，请从草稿列表编辑');await run('save-draft',id,{text:content},value.confirmation)}catch(e){$('dialog-error').textContent=e.message}};
};
$('configure').onclick=()=>preview('configure');$('doctor').onclick=()=>simple('doctor');$('initialize').onclick=()=>simple('init');
$('index-rag').onclick=()=>simple('rag-index');
$('search-rag').onclick=async()=>{const key=selected;$('rag-result').textContent='检索并检查当前文件…';try{const d=await api(`/api/rag?project=${key}&q=${encodeURIComponent($('rag-query').value)}`);if(key!==selected)return;$('rag-result').innerHTML=`<p>${esc(d.mode)} · ${d.index.files} files · ${d.index.chunks} chunks · 更新 ${d.index.changed} / 删除 ${d.index.removed}</p>${d.warning?`<p class="bad">${esc(d.warning)}</p>`:''}`+d.hits.map(h=>`<h3>${esc(h.citation)}–${h.end}</h3><p class="muted">SHA256 ${esc(h.sha256)}</p><pre>${esc(h.text)}</pre>`).join('')+(d.hits.length?'':'<p>没有命中。</p>')}catch(e){$('rag-result').textContent=e.message}};
$('history').onclick=async()=>{try{const d=await api(`/api/jobs?project=${selected}`);pending=null;dialog('本地作业历史',d.map(j=>block(`${j.action} ${j.ticket||''} · ${j.status}`,j.error||j.result||j.output||'待检查')).join('')||'<p>暂无历史</p>')}catch(e){report(e)}};
refresh();

</script></html>
