<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>dev-agent · Local dashboard</title>
<style>
:root{color-scheme:dark;--bg:#101310;--panel:#191e19;--line:#303930;--muted:#9ba99b;--accent:#c1f080}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#edf3e9;font:14px/1.6 system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:wait}.layout{display:grid;grid-template-columns:245px 1fr;min-height:100vh}aside{border-right:1px solid var(--line);padding:28px 18px;background:#141814}.brand{font-size:23px;font-weight:700;letter-spacing:-1px}.brand b{color:var(--accent)}.eyebrow{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}.local{display:inline-block;border:1px solid var(--line);border-radius:20px;padding:3px 10px;color:var(--accent);margin:16px 0 40px}.project{display:block;text-align:left;width:100%;padding:14px;margin-top:9px;background:transparent;color:inherit;border:1px solid transparent;border-radius:9px;overflow:hidden}.project.active{background:#273223;border-color:#4d6341}.project small{display:block;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}main{padding:36px 42px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:32px;font-weight:550;letter-spacing:-1px;margin:4px 0}p{color:var(--muted);margin:4px 0 20px}button,.button{border:1px solid var(--line);background:#242c23;color:#edf3e9;padding:8px 14px;border-radius:7px}.primary{background:var(--accent);color:#1b2912;border-color:var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:26px 0}.stat,.card{background:var(--panel);border:1px solid var(--line);border-radius:12px}.stat{padding:18px 22px;color:var(--muted)}.stat strong{display:block;color:#f2f7ee;font-size:32px;font-weight:500}.toolbar{display:flex;gap:12px;margin:24px 0 16px}input,select{background:#191e19;border:1px solid var(--line);color:inherit;border-radius:7px;padding:10px}input{flex:1;min-width:100px}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1px;font-weight:500}td,th{padding:15px 18px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}tbody tr{cursor:pointer}tbody tr:hover{background:#242d22}.badge{display:inline-flex;align-items:center;gap:7px;color:var(--accent);font-size:11px}.badge:before{content:'';height:6px;width:6px;border-radius:50%;background:currentColor}.running:before{animation:pulse 1.4s infinite}.bad{color:#ffb38b}.muted{color:var(--muted);font-size:12px}.empty{padding:40px;text-align:center;color:var(--muted)}#notice{color:#ffb38b;white-space:pre-wrap}.detail{margin-top:26px;padding:24px}.detail h2{margin-top:0}.detail h3{font-size:14px;color:var(--accent);margin-top:25px}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.wrap{overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#101610;border:1px solid var(--line);border-radius:8px;padding:15px;font:12px/1.6 ui-monospace,monospace;max-height:430px;overflow:auto}.command{display:flex;gap:10px;margin:9px 0;align-items:center}.command code{flex:1;overflow-wrap:anywhere}.split{display:grid;grid-template-columns:1fr 1fr;gap:18px}#job{margin-top:20px}footer{margin-top:20px;color:var(--muted);font-size:12px}@keyframes pulse{50%{opacity:.2;box-shadow:0 0 0 5px #c1f02015}}@media(max-width:900px){.layout{grid-template-columns:1fr}aside{border-right:0;border-bottom:1px solid var(--line);padding:18px}.local{margin:8px}.project{display:inline-block;width:220px}main{padding:22px}.stats{gap:8px}.stat{padding:12px}.split{grid-template-columns:1fr}header{align-items:start}.hide-mobile{display:none}}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
</style>
<div class="layout"><aside><div class="brand">dev-agent<b> /</b></div><div class="local">● Local workspace</div><div class="eyebrow">Projects</div><nav id="projects"></nav><footer>本地运行 · 数据留在项目中<br>测试执行你的 commands.test</footer></aside><main><header><div><div class="eyebrow">Workspace overview</div><h1 id="title">Dashboard</h1><p id="path">正在连接本地 dev-agent…</p></div><button id="test" class="primary">运行 test</button></header><div id="notice" role="alert"></div><section class="stats" id="stats"></section><div class="toolbar"><input id="search" aria-label="搜索 ticket" placeholder="搜索 ticket ID 或阶段…"><select id="filter" aria-label="状态筛选"><option value="all">所有状态</option><option value="active">处理中</option><option value="review">待审查</option><option value="attention">需要处理</option><option value="merged">已合并</option></select></div><div class="card wrap"><table><thead><tr><th>Ticket</th><th>状态</th><th>当前阶段</th><th class="hide-mobile">最近更新</th><th></th></tr></thead><tbody id="tickets"></tbody></table><div id="empty" class="empty" hidden>还没有运行记录。在此项目中用 dev-agent start 启动第一个 ticket。</div></div><div id="job"></div><section id="detail" class="card detail" hidden></section><footer id="connection">每 3 秒刷新 · 打开 ticket 查看审查摘要</footer></main></div>
<script>
const token=location.hash.slice(1)||sessionStorage.getItem('dashboardToken');if(token)sessionStorage.setItem('dashboardToken',token);history.replaceState(null,'',location.pathname);
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data={projects:[],jobs:{}},selected='0',detailId=null,detailGeneration=0;
function html(id,value){if($(id).innerHTML!==value)$(id).innerHTML=value}
async function api(path,body){let r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Dashboard-Token':token||'','Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});let d=await r.json();if(!r.ok)throw Error(d.error||r.statusText);return d;}
function category(t){if(t.state==='MERGED')return 'merged';if(t.state==='RUNNING')return 'active';if(t.state==='READY_FOR_HUMAN_REVIEW')return 'review';return 'attention';}
function project(){return data.projects.find(p=>p.id===selected)}
function badge(t){return `<span class="badge ${category(t)==='active'?'running':''} ${category(t)==='attention'?'bad':''}">${esc(t.state)}</span>`}
function render(){const p=project();if(!p)return;$('title').textContent=p.name;$('path').textContent=p.path;html('projects',data.projects.map(x=>`<button class="project ${x.id===selected?'active':''}" data-project="${x.id}">${esc(x.name)} <span class="muted">${x.tickets.length}</span><small>${esc(x.path)}</small></button>`).join(''));document.querySelectorAll('[data-project]').forEach(b=>b.onclick=()=>{selected=b.dataset.project;detailId=null;detailGeneration++;$('detail').hidden=true;render()});$('notice').textContent=p.error||'';
$('stats').innerHTML=[['全部 Tickets',p.tickets.length],['处理中',p.tickets.filter(t=>category(t)==='active').length],['待审查',p.tickets.filter(t=>category(t)==='review').length],['需要处理',p.tickets.filter(t=>category(t)==='attention').length]].map(([k,v])=>`<div class="stat">${k}<strong>${v}</strong></div>`).join('');
const q=$('search').value.toLowerCase(),f=$('filter').value;let list=p.tickets.filter(t=>(f==='all'||category(t)===f)&&[t.ticket_id,t.current_step].join(' ').toLowerCase().includes(q));$('tickets').innerHTML=list.map(t=>`<tr tabindex="0" data-ticket="${esc(t.ticket_id)}"><td><strong>${esc(t.ticket_id)}</strong></td><td>${badge(t)}</td><td class="muted">${esc(t.current_step||'—')}</td><td class="hide-mobile muted">${esc(new Date(t.updated_at).toLocaleString())}</td><td>↗</td></tr>`).join('');$('empty').hidden=list.length>0;$('empty').textContent=p.tickets.length?'没有匹配的 tickets。':'还没有运行记录。在此项目中用 dev-agent start 启动第一个 ticket。';document.querySelectorAll('[data-ticket]').forEach(r=>{r.onclick=()=>show(r.dataset.ticket);r.onkeydown=e=>{if(e.key==='Enter')show(r.dataset.ticket)}});
const j=data.jobs[selected];$('test').disabled=!!j?.running;$('job').innerHTML=j?`<div class="card detail"><div class="row"><strong>配置测试</strong><span class="badge ${j.running?'running':j.exit_code?'bad':''}">${j.running?'运行中':j.exit_code===0?'通过':'失败'} · ${j.elapsed}s</span></div><p>${esc(j.command)}</p><pre>${esc(j.output||'没有输出')}</pre><small>此测试在主项目目录运行，不替代 ticket worktree 的验证。</small></div>`:'';
}
function block(title,value){return `<h3>${title}</h3><pre>${esc(typeof value==='string'?value:JSON.stringify(value,null,2))}</pre>`}
function evidence(title,value,kind){
if(!value)return `<h3>${title}</h3><p>暂无记录</p>`;
let content='';
if(kind==='validation')content=`<p>${esc(value.status)} · ${value.current?'当前证据':'过期 / 未验证'}</p>`+value.commands.map(c=>`<div class="command"><strong>${esc(c.name)}</strong><span>${esc(c.status)} · exit ${esc(c.exit_code)}</span></div><pre>${esc(c.command)}</pre>`).join('');
if(kind==='review')content=`<p>${esc(value.status)} · ${value.current?'当前证据':'过期 / 未验证'} · ${value.findings.length} 个问题</p>`+value.findings.map(f=>`<pre>[${esc(f.severity)}] ${esc(f.file)}:${esc(f.line)}\n${esc(f.scenario)}\n建议：${esc(f.recommendation)}</pre>`).join('');
if(kind==='usage')content=[['模型调用',value.calls],['输入 tokens',value.input_tokens],['输出 tokens',value.output_tokens],['缓存读取',value.cache_read_tokens],['缓存写入',value.cache_write_tokens]].map(([k,v])=>`<div class="row"><span class="muted">${k}</span><strong>${v==null?'未记录':Number(v).toLocaleString()}</strong></div>`).join('')+'<p class="muted">部分模型可能缺少用量；完整性以 CLI usage 为准。</p>';
if(kind==='files')content=value.length?value.map(f=>`<div class="command"><span class="badge">${esc(f.status)}</span><code>${esc(f.path)}</code></div>`).join(''):'<p>无变更文件</p>';
if(kind==='steps')content=value.map(t=>`<div class="command"><strong>${esc(t.name)}</strong><span class="badge ${t.status==='FAILED'?'bad':''}">${esc(t.status)}</span><span class="muted">${esc(new Date(t.started_at).toLocaleString())}</span></div>${t.error?`<pre>${esc(t.error)}</pre>`:''}`).join('')||'<p>暂无阶段记录</p>';
return `<h3>${title}</h3>${content}`;
}
async function show(id){detailId=id;let generation=++detailGeneration;const key=selected,el=$('detail');el.hidden=false;el.textContent='正在检查当前证据…';try{const d=await api(`/api/ticket?project=${key}&ticket=${encodeURIComponent(id)}`);if(generation!==detailGeneration)return;const run=project().tickets.find(t=>t.ticket_id===id);el.innerHTML=`<div class="row"><h2>${esc(id)}</h2><button id="refresh-detail">刷新详情</button></div><p>${esc(d.worktree||'尚未创建 worktree')}</p>${run?.error?block('停止原因',run.error):''}${d.warnings.length?block('注意事项',d.warnings.join('\n')):''}<div class="split"><div>${evidence('验证结果',d.validation,'validation')}${evidence('Review findings',d.review,'review')}</div><div>${evidence('Token 用量',d.usage,'usage')}${evidence('变更文件',d.files,'files')}</div></div>${evidence('阶段时间线',d.steps,'steps')}<h3>继续操作</h3><p>在项目目录执行。审核和合并继续使用 CLI 的交互与检查。</p><div id="commands"></div>`;
const cmds=[`cd ${quote(project().path)}`,...d.commands,...(d.state==='READY_FOR_HUMAN_REVIEW'?[`dev-agent sync ${quote(id)}`]:[])];cmds.forEach(c=>{let row=document.createElement('div');row.className='command';let code=document.createElement('code');code.textContent=c;let b=document.createElement('button');b.textContent='复制';b.onclick=async()=>{try{await navigator.clipboard.writeText(c);b.textContent='已复制'}catch{b.textContent='请手动复制'}};row.append(code,b);$('commands').append(row)});$('refresh-detail').onclick=()=>show(id);
}catch(e){if(generation===detailGeneration)el.textContent=e.message}}
function quote(s){return "'"+s.replaceAll("'","'\\''")+"'"}
async function refresh(){try{data=await api('/api/projects');render();$('connection').textContent='● 已连接 · '+new Date().toLocaleTimeString()+' · 每 3 秒刷新列表；状态是最近记录，非进程存活证明；详情手动刷新';}catch(e){$('notice').textContent=e.message;$('connection').textContent='连接中断 · 检查 dashboard 进程是否还在运行'}finally{setTimeout(refresh,3000)}}
$('search').oninput=render;$('filter').onchange=render;$('test').onclick=async()=>{if(!confirm('在当前项目目录运行 .dev-agent.yaml 中的 commands.test？'))return;try{await api('/api/test',{project:selected});data=await api('/api/projects');render()}catch(e){$('notice').textContent=e.message}};refresh();
</script></html>
