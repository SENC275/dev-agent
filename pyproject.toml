[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dev-agent"
version = "0.1.0"
description = "A local, provider-agnostic engineering workflow CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["typer>=0.12,<1", "pydantic>=2,<3", "PyYAML>=6,<7", "rich>=13,<15", "httpx>=0.27,<1", "jsonschema>=4.23,<5"]

[project.scripts]
dev-agent = "dev_agent.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-PyYAML>=6", "types-jsonschema>=4"]

[tool.hatch.build.targets.wheel]
packages = ["dev_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: optional tests requiring a real provider"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
